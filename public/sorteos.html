<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteos Disponibles - Juega y Gana</title>
<link rel="stylesheet" href="/css/sorteos.css?v=16">
<style>
  .card-countdown{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 10px;border-radius:999px;background:#007B4B;color:#fff;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .card-countdown.warn{background:#e67e22;}
  .card-countdown.expired{background:#C8102E;}
  .btn-participar.is-finalizado{background:#999!important;cursor:not-allowed!important;}
</style>
</head>
<body>
<header class="topbar">
  <a href="/" class="btn-back">← Volver al Inicio</a>
  <div class="brand">Juega y Gana</div>
</header>

<div class="main-container">
  <div class="col-left">
    <div class="banner-container">
      <div id="banner-rotativo" class="banner-rotativo"></div>
    </div>
    
    <div class="section-header-sorteos">
      <h2 class="section-title">Sorteos Disponibles</h2>
    </div>
    
    <div class="carrusel-sorteos-wrapper">
      <button class="arrow-btn-sorteos arrow-btn-sorteos-left" onclick="scrollSorteos(-1)" aria-label="Anterior">❮</button>
      <button class="arrow-btn-sorteos arrow-btn-sorteos-right" onclick="scrollSorteos(1)" aria-label="Siguiente">❯</button>
      <div class="grid-sorteos" id="grid-sorteos"></div>
    </div>
  </div>

  <div class="col-right">
    <div class="promos-header">
      <h3>Promociones</h3>
      <div class="arrow-buttons">
        <button onclick="scrollPromos(-1)">⬆</button>
        <button onclick="scrollPromos(1)">⬇</button>
      </div>
    </div>
    <div class="promos-viewport" id="promos-viewport">
      <div class="promos-track" id="promos-track"></div>
    </div>
  </div>
</div>

<!-- MODAL DE COMPRA -->
<div class="modal-overlay hidden" id="modal-compra">
  <div class="modal-content">
    <button class="btn-close" onclick="cerrarModal()">✖</button>
    <h2 id="modal-titulo">Participar en el Sorteo</h2>
    
    <form id="form-compra" onsubmit="comprarTickets(event)">
      <input type="hidden" id="compra-sorteo-id">
      <input type="hidden" id="compra-precio">
      
      <!-- DNI PRIMERO -->
      <div class="form-group">
        <label>DNI <span id="dni-status" class="status-badge"></span></label>
        <input type="text" id="inp-dni" maxlength="8" inputmode="numeric" placeholder="Ingrese 8 dígitos" required oninput="this.value = this.value.toUpperCase()">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Celular</label>
          <input type="text" id="inp-celular" maxlength="9" inputmode="numeric" required style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
        </div>
        <div class="form-group">
  <label>Departamento</label>
  <select id="inp-departamento" required style="text-transform: uppercase;">
    <option value="">Selecciona un departamento...</option>
    <option value="AMAZONAS">AMAZONAS</option>
    <option value="ANCASH">ANCASH</option>
    <option value="APURÍMAC">APURÍMAC</option>
    <option value="AREQUIPA">AREQUIPA</option>
    <option value="AYACUCHO">AYACUCHO</option>
    <option value="CAJAMARCA">CAJAMARCA</option>
    <option value="CALLAO">CALLAO</option>
    <option value="CUSCO">CUSCO</option>
    <option value="HUANCAVELICA">HUANCAVELICA</option>
    <option value="HUÁNUCO">HUÁNUCO</option>
    <option value="ICA">ICA</option>
    <option value="JUNÍN">JUNÍN</option>
    <option value="LA LIBERTAD">LA LIBERTAD</option>
    <option value="LAMBAYEQUE">LAMBAYEQUE</option>
    <option value="LIMA">LIMA</option>
    <option value="LORETO">LORETO</option>
    <option value="MADRE DE DIOS">MADRE DE DIOS</option>
    <option value="MOQUEGUA">MOQUEGUA</option>
    <option value="PASCO">PASCO</option>
    <option value="PIURA">PIURA</option>
    <option value="PUNO">PUNO</option>
    <option value="SAN MARTÍN">SAN MARTÍN</option>
    <option value="TACNA">TACNA</option>
    <option value="TUMBES">TUMBES</option>
    <option value="UCAYALI">UCAYALI</option>
  </select>
</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nombres</label>
          <input type="text" id="inp-nombres" required style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
        </div>
        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" id="inp-apellidos" required style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
        </div>
      </div>
      
      <div class="form-group">
        <label>Cantidad de Tickets (S/ <span id="precio-unitario">0</span> c/u)</label>
        <input type="number" id="inp-cantidad" min="1" value="1" required>
      </div>
      
      <div class="form-group">
        <label>Comprobante de Pago (Yape / Plin)</label>
        <input type="file" id="inp-comprobante" accept="image/png, image/jpeg, image/jpg" required style="border: 1px dashed #ccc; padding: 0.5rem; background: #f9f9f9;">
        <small style="color: #666; font-size: 0.8rem; display: block; margin-top: 4px;">
          📸 Sube la captura de pantalla de tu pago (Yape/Plin, vertical). Máx. 5MB. No se aceptan duplicados.
        </small>
        <div id="error-comprobante" style="display:none; margin-top:6px; padding:8px 10px; background:#fdecea; color:#b71c1c; border:1px solid #f5c6cb; border-radius:6px; font-size:0.85rem;"></div>
      </div>

      <div class="resumen-total">
        Total a Pagar: <span id="total-pagar">S/ 0.00</span>
      </div>

      <button type="submit" class="btn-submit">Confirmar Compra</button>
    </form>
    <div id="resultado-compra" class="hidden" style="margin-top:1rem; text-align:center;"></div>
  </div>
</div>

<script src="/js/sorteos.js?v=16"></script>
</body>
</html>
